[project]
name = "rag-szkolenia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agno[openai,sqlite,os]>=3.0.9",
    "chroma-haystack>=4.5.0",
    "faiss-haystack>=2.1.0",
    "fastembed-haystack>=2.7.0",
    "haystack-ai>=3.1.0",
    "neo4j-haystack>=2.2.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "qdrant-haystack>=10.6.0",
    "sentence-transformers>=6.0.1",
    "sentence-transformers-haystack>=0.1.1",
    "torch>=2.13",
    "uvicorn>=0.52.4",
]

[project.scripts]
search = "search.cli:main"
agents-eval = "agents.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/agents", "src/api.py", "src/cli.py", "src/settings.py", "src/search"]


[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
