services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"  # HTTP port
      - "6334:6334"  # gRPC port
    volumes:
      - ./data_rag/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    #environment:
    #  QDRANT__SERVICE__API_KEY: "your_api_key_here"

#volumes:
#  qdrant_storage:
