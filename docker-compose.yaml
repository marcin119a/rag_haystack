services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"  # HTTP port
      - "6334:6334"  # gRPC port
    volumes:
      - ./data_rag/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"  # przeglądarka/interfejs HTTP
      - "7687:7687"  # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jpassword}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  neo4j_data:

